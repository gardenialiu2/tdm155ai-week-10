<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flower Arranger</title>
<style>
  :root { --bg:#0c1013; --panel:#12181c; --line:#243038; --fg:#e9edef; --dim:#8a98a2; --acc:#f4b6cf; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: ui-monospace, Menlo, monospace; font-size:12px; }
  header { padding: 18px 20px 6px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 14px; letter-spacing: .2em; text-transform: uppercase; font-weight: 400; margin: 0 0 6px; }
  header p { margin: 0; color: var(--dim); line-height: 1.5; max-width: 760px; }
  .app { display: grid; grid-template-columns: 296px minmax(0,1fr); gap: 16px; max-width: 1400px; margin: 0 auto; padding: 12px 20px 60px; align-items: start; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } }
  aside { background: var(--panel); border: 1px solid var(--line); padding: 10px 10px 14px; position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; }
  @media (max-width: 900px) { aside { position: static; max-height: none; } }
  h3 { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; font-weight: 400; color: var(--dim); margin: 12px 2px 6px; }
  h3:first-child { margin-top: 2px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .fl { background: #0a0e11; border: 1px solid var(--line); color: var(--fg); padding: 2px 2px 5px; cursor: pointer; font: inherit; font-size: 10px; text-align: center; }
  .fl canvas { width: 100%; display: block; image-rendering: pixelated; }
  .fl:hover { border-color: #4a5c68; }
  .fl.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-bottom: 10px; }
  .grp { display: flex; gap: 4px; align-items: center; }
  .grp > span { color: var(--dim); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; margin-right: 2px; }
  button.b { background: var(--panel); color: var(--fg); border: 1px solid var(--line); font: inherit; font-size: 11px; padding: 5px 9px; cursor: pointer; }
  button.b:hover { border-color: #4a5c68; }
  button.b.on { border-color: var(--acc); color: var(--acc); }
  button.b:disabled { opacity: .35; cursor: default; }
  .sw { width: 18px; height: 18px; border: 1px solid #000a; cursor: pointer; padding: 0; }
  .sw.on { outline: 2px solid var(--acc); outline-offset: 1px; }
  .stagewrap { background: #000; border: 1px solid var(--line); overflow: hidden; display: flex; justify-content: center; }
  pre#stage { margin: 0; line-height: 1; font-family: Menlo, "DejaVu Sans Mono", ui-monospace, monospace; white-space: pre; cursor: crosshair; user-select: none; touch-action: none; }
  .insp { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; min-height: 48px; }
  .insp .nm { letter-spacing: .15em; text-transform: uppercase; color: var(--acc); }
  .insp label { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  .insp input[type=range] { width: 110px; accent-color: var(--acc); }
  .hint { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Flower arranger / ASCII</h1>
  <p>Pick a flower on the left, then click the stage to place its head: the stem curves down into the vase on its own. Click a flower to select it, drag to move it, scroll to resize.</p>
</header>
<div class="app">
  <aside id="palette"></aside>
  <section>
    <div class="bar" id="bar"></div>
    <div class="stagewrap"><pre id="stage"></pre></div>
    <div class="insp" id="insp"></div>
  </section>
</div>
<script>
"use strict";
/* ============================================================
   Flower arranger — half-block pixel art (same look as index.html)
   Fine pixel grid SW x SH; every text row shows two fine rows via "▀".
   A fine pixel is 1.2x wider than tall (ASPX), handled in all shape maths.
   ============================================================ */
const SW = 240, SH = 224, A = 1.2, D2R = Math.PI / 180;
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const cs = a => Math.cos(a * D2R), sn = a => Math.sin(a * D2R);
const hash = (a, b, c = 0) => {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2147483647)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
};
const mkc = (w, h) => ({ w, h, d: new Array(w * h).fill(null) });
const px = (c, x, y, col) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < c.w && y < c.h) c.d[y * c.w + x] = col; };
const dith = (x, y, v, cols) => {
  v += (hash(x, y, 5) - .5) * .16;
  const f = clamp(v) * (cols.length - 1), i = Math.min(cols.length - 2, Math.floor(f));
  return f - i > (BAY[(y & 3) * 4 + (x & 3)] + .5) / 16 ? cols[i + 1] : cols[i];
};
/* colours */
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = r => "#" + r.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, "0")).join("");
const mix = (a, b, t) => { const p = hex2rgb(a), q = hex2rgb(b); return rgb2hex(p.map((v, i) => v + (q[i] - v) * t)); };
const RAMPS = {};
/* a palette = [6 colours dark -> light, outline] built from one base colour */
function ramp(base) {
  if (RAMPS[base]) return RAMPS[base];
  const K = "#1a0a1c", W = "#ffffff";
  return RAMPS[base] = [[mix(base, K, .78), mix(base, K, .5), mix(base, K, .22), base, mix(base, W, .35), mix(base, W, .7)], mix(base, K, .62)];
}
const GREEN = ramp("#3f8f55"), YEL = ramp("#f0b41a"), BROWN = ramp("#6b3d1e"), DARK = ramp("#2a1535"), MAG = ramp("#c2307f");

/* ---------------- shape primitives ---------------- */
/* pointed-oval petal from (ox,oy) along physical angle ang. o: k,m shape; vb,vt base/tip brightness; veins; spots; base:{u,cols}; streak; lite; ol(false=none); notch; sq */
function petal(c, ox, oy, ang, len, wid, P, o = {}) {
  if (len < 1.2 || wid < .4) return;
  const [cols, ol] = P, ca = cs(ang), sa = sn(ang), r = Math.ceil(len + 2), k = o.k ?? .72, m = o.m ?? .8, sq = o.sq ?? 1;
  const oc = o.ol === false ? null : (o.ol || ol);
  const x0 = Math.floor(ox - r / A - 1), x1 = Math.ceil(ox + r / A + 1), y0 = Math.floor(oy - r * sq - 1), y1 = Math.ceil(oy + r * sq + 1);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const dx = (x - ox) * A, dy = (y - oy) / sq, u = (dx * ca + dy * sa) / len, vv = -dx * sa + dy * ca;
    if (u < 0 || u > 1) continue;
    const hw = wid * Math.pow(Math.sin(Math.PI * Math.pow(u, k)), m), av = Math.abs(vv);
    if (av > hw) continue;
    if (o.notch && u > .86 + .14 * Math.min(1, av / (hw * .6 + .01))) continue;
    if (oc && (hw - av < 1.05 || (u > .965 && hw < 2))) { px(c, x, y, oc); continue; }
    const e = av / (hw + .01);
    let v = (o.vb ?? .95) + ((o.vt ?? .4) - (o.vb ?? .95)) * Math.pow(u, 1.3) - .22 * e * e + (o.lite || 0);
    if (o.streak) v += .11 * Math.sin(vv * 1.1 + ang);
    if (av < .6 && u > .1) v -= .2;
    else if (o.veins && u > .1 && Math.cos((vv / hw) * o.veins * Math.PI) > .84) v -= .17;
    if (o.base && u < o.base.u) { px(c, x, y, dith(x, y, .45 + .5 * u / o.base.u - e * .2, o.base.cols)); continue; }
    if (o.spots && u > .2 && u < .8 && e < .75 && hash((x >> 1) + 3, (y >> 1) + 7, 21) < .1) { px(c, x, y, o.spots); continue; }
    px(c, x, y, dith(x, y, v, cols));
  }
}
/* shaded dome */
function disc(c, cx, cy, r, P, o = {}) {
  const [cols, ol] = P;
  for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++) for (let x = Math.floor(cx - r / A - 1); x <= cx + r / A + 1; x++) {
    const dx = (x - cx) * A, dy = y - cy, d = Math.hypot(dx, dy);
    if (d > r) continue;
    if (o.ol !== false && r - d < 1.05) { px(c, x, y, ol); continue; }
    const nx = dx / r, ny = dy / r, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
    px(c, x, y, dith(x, y, .18 + .85 * Math.max(0, -.4 * nx - .55 * ny + .72 * nz) + (o.lite || 0), cols));
  }
  if (o.seeds) for (let i = 0; i < o.seeds; i++) {
    const a = i * 137.508, rr = r * Math.sqrt((i + .5) / o.seeds) * .92, x = cx + cs(a) * rr / A, y = cy + sn(a) * rr;
    px(c, x, y, cols[0]); px(c, x + 1, y, cols[Math.min(4, cols.length - 1)]);
  }
}
const at = (cx, cy, ang, d) => [cx + cs(ang) * d / A, cy + sn(ang) * d];
function ringP(c, cx, cy, rot, n, off, len, wid, P, o = {}) {
  for (let i = 0; i < n; i++) {
    const j = (hash(i, n, len | 0) - .5) * (o.jit ?? 6), lj = 1 + (hash(i, n, 3) - .5) * (o.lj ?? .08);
    petal(c, cx, cy, rot + off + i * 360 / n + j, len * lj, wid, P, o);
  }
}
const dot2 = (c, x, y, P) => { const k = P[0]; px(c, x, y, k[5]); px(c, x + 1, y, k[4]); px(c, x, y + 1, k[3]); px(c, x + 1, y + 1, k[2]); };

/* ---------------- flower heads: (c, cx, cy, R, rot, P, seed) ---------------- */
function rosette(c, cx, cy, R, rot, P, seed, o) {
  const [cols, ol] = P, K = o.K, rings = [], bs = new Array(K);
  for (let k = 0; k < K; k++) rings.push([1 - k * (.82 / K), hash(seed, k, 1) * 6.28, o.n0 + Math.floor(hash(seed, k, 2) * o.nv)]);
  if (o.sep) for (let a = 0; a < 5; a++) petal(c, cx, cy, rot + 20 + a * 72, R * 1.2, R * .24, GREEN, { vb: .9, vt: .45, veins: 1 });
  for (let y = Math.floor(cy - R * 1.2 - 2); y <= cy + R * 1.2 + 2; y++) for (let x = Math.floor(cx - R * 1.2 / A - 2); x <= cx + R * 1.2 / A + 2; x++) {
    const dx = (x - cx) * A, dy = y - cy, r = Math.hypot(dx, dy), ang = Math.atan2(dy, dx) - rot * D2R;
    let kk = -1;
    for (let k = 0; k < K; k++) {
      const [f, ph, n] = rings[k];
      bs[k] = R * f * (1 + o.ruf * (.09 * Math.cos(n * ang + ph) + .045 * Math.cos((n + 2) * ang + ph * 2)));
      if (r < bs[k]) kk = k;
    }
    if (kk < 0) continue;
    const bk = bs[kk];
    if (bk - r < (o.olw ?? 1.05)) { px(c, x, y, ol); continue; }
    const inner = kk + 1 < K ? Math.min(bs[kk + 1] * .94, bk - 1) : 0, s = clamp((r - inner) / (bk - inner + .01));
    let v = .2 + .72 * Math.pow(s, .85) + .1 * Math.cos(rings[kk][2] * 2 * ang + rings[kk][1]) + .12 * Math.cos(ang + 2.4) * s - kk * .015;
    if (kk === K - 1 && Math.sin(r * .5 - ang * 2) > .78) { px(c, x, y, ol); continue; }
    px(c, x, y, dith(x, y, v, cols));
  }
}
const rose = (c, cx, cy, R, rot, P, s) => rosette(c, cx, cy, R, rot, P, s, { K: 6, n0: 3, nv: 3, ruf: 1, sep: true });
const peony = (c, cx, cy, R, rot, P, s) => rosette(c, cx, cy, R, rot, P, s, { K: 7, n0: 5, nv: 4, ruf: 2.3, olw: .8 });
const ranunculus = (c, cx, cy, R, rot, P, s) => rosette(c, cx, cy, R, rot, P, s, { K: 9, n0: 5, nv: 3, ruf: .6, olw: .7 });
const carnation = (c, cx, cy, R, rot, P, s) => rosette(c, cx, cy, R, rot, P, s, { K: 5, n0: 11, nv: 4, ruf: 2.6, sep: true });

function daisy(c, cx, cy, R, rot, P) {
  const o = { k: .8, m: .7, vb: .45, vt: .95, streak: true, veins: 1 };
  ringP(c, cx, cy, rot, 18, 0, R, R * .15, P, o); ringP(c, cx, cy, rot, 18, 10, R * .9, R * .15, P, { ...o, lite: .08 });
  disc(c, cx, cy, R * .27, YEL, { seeds: 30 });
}
function gerbera(c, cx, cy, R, rot, P) {
  const o = { k: .85, m: .7, vb: .45, vt: .95, streak: true };
  ringP(c, cx, cy, rot, 22, 0, R, R * .12, P, o); ringP(c, cx, cy, rot, 22, 8, R * .93, R * .12, P, { ...o, lite: .06 });
  ringP(c, cx, cy, rot, 18, 3, R * .6, R * .09, P, { ...o, lite: .12 });
  disc(c, cx, cy, R * .3, ramp("#a89a2a"), { seeds: 24 }); disc(c, cx, cy, R * .17, DARK);
}
function sunflower(c, cx, cy, R, rot, P) {
  const o = { k: .8, m: .7, vb: .45, vt: .95, streak: true, veins: 1 };
  ringP(c, cx, cy, rot, 17, 0, R, R * .19, P, o); ringP(c, cx, cy, rot, 17, 10.5, R * .92, R * .19, P, { ...o, lite: .08 });
  disc(c, cx, cy, R * .56, BROWN, { seeds: 150 });
}
function dahlia(c, cx, cy, R, rot, P) {
  [[16, 0, 1, .17], [14, 5, .84, .17], [12, 9, .68, .17], [10, 13, .52, .16], [8, 5, .38, .15], [6, 0, .22, .12]].forEach(([n, off, f, w], i) =>
    ringP(c, cx, cy, rot, n, off, R * f, R * w, P, { k: .75, m: .65, vb: .3 + i * .05, vt: .95, veins: 1, lite: i * .02 }));
}
function cosmos(c, cx, cy, R, rot, P) {
  ringP(c, cx, cy, rot, 8, 0, R, R * .4, P, { k: .9, m: .6, notch: true, vb: .45, vt: .95, veins: 4, jit: 4 });
  disc(c, cx, cy, R * .15, YEL, { seeds: 10 });
}
function poppy(c, cx, cy, R, rot, P) {
  const o = { k: .9, m: .5, vb: .55, vt: .95, streak: true, veins: 6, base: { u: .2, cols: DARK[0] } };
  petal(c, cx, cy, rot + 20, R, R * .62, P, { ...o, lite: -.1 }); petal(c, cx, cy, rot + 200, R, R * .62, P, { ...o, lite: -.1 });
  petal(c, cx, cy, rot + 110, R * .98, R * .6, P, o); petal(c, cx, cy, rot + 290, R * .98, R * .6, P, o);
  disc(c, cx, cy, R * .15, ramp("#8aa070"));
  for (let i = 0; i < 26; i++) { const [x, y] = at(cx, cy, i * 360 / 26, R * (.2 + .06 * hash(i, 1, 1))); px(c, x, y, DARK[0]); if (i % 3 == 0) px(c, x + 1, y, "#6a3a7a"); }
}
function anemone(c, cx, cy, R, rot, P) {
  ringP(c, cx, cy, rot, 7, 0, R, R * .42, P, { k: .85, m: .6, vb: .45, vt: .95, veins: 3 });
  const C = ramp("#3b2a5a"); disc(c, cx, cy, R * .22, C);
  for (let i = 0; i < 32; i++) { const a = i * 360 / 32, L = R * (.3 + .05 * hash(i, 2, 2));
    for (let d = R * .2; d < L; d += .8) { const [x, y] = at(cx, cy, a, d); px(c, x, y, C[1]); }
    const [x, y] = at(cx, cy, a, L); px(c, x, y, "#d8c8f0"); }
}
function mum(c, cx, cy, R, rot, P) {
  [[26, 0, 1, .09], [24, 4, .84, .09], [20, 7, .68, .1], [14, 3, .48, .1]].forEach(([n, off, f, w], i) =>
    ringP(c, cx, cy, rot, n, off, R * f, R * w, P, { k: .8, m: .8, ol: false, vb: .5 + i * .06, vt: .95, lite: i * .03, lj: .14 }));
  disc(c, cx, cy, R * .1, ramp("#c8c040"), { ol: false });
}
function lily(c, cx, cy, R, rot, P) {
  const spot = mix(P[0][2], "#2a0a1c", .5);
  [0, 1].forEach(r => { for (let k = 0; k < 3; k++) petal(c, cx, cy, rot + r * 60 + k * 120, R * (r ? .95 : 1), R * (r ? .3 : .24), P,
    { k: .8, m: .75, vb: .5, vt: .95, veins: 1, spots: spot, base: { u: .2, cols: ramp("#6aa050")[0] }, lite: r ? .08 : -.04 }); });
  for (let k = 0; k < 6; k++) { const a = rot + 20 + k * 60, L = R * .45;
    for (let d = 0; d < L; d += .8) { const [x, y] = at(cx, cy, a, d); px(c, x, y, "#eef2e6"); }
    const [ex, ey] = at(cx, cy, a, L); for (const [i, j] of [[0, 0], [1, 0], [0, 1], [1, 1]]) px(c, ex + i, ey + j, i + j ? "#b0334a" : "#6a1226"); }
}
function orchid(c, cx, cy, R, rot, P) {
  const f = R / 30, o = { k: .85, m: .7, vb: .3, vt: .92, veins: 5 };
  petal(c, cx, cy, rot + 128, 28 * f, 9 * f, P, { ...o, lite: -.05 }); petal(c, cx, cy, rot + 52, 28 * f, 9 * f, P, { ...o, lite: -.05 });
  petal(c, cx, cy, rot - 90, 30 * f, 9.5 * f, P, o);
  petal(c, cx, cy, rot + 196, 29 * f, 17 * f, P, { ...o, k: 1, m: .55, lite: .05 }); petal(c, cx, cy, rot - 16, 29 * f, 17 * f, P, { ...o, k: 1, m: .55, lite: .05 });
  petal(c, cx, cy + 1, rot + 90, 17 * f, 6.5 * f, MAG, { k: .8, vb: .1, vt: .7, ol: MAG[1], veins: 3 });
  petal(c, cx, cy + 1, rot + 148, 10 * f, 3.4 * f, MAG, { k: .8, vb: .15, vt: .6 }); petal(c, cx, cy + 1, rot + 32, 10 * f, 3.4 * f, MAG, { k: .8, vb: .15, vt: .6 });
  for (let i = 0; i < 6; i++) px(c, cx - 1 + (i % 3), cy - 1 + (i > 2 ? 1 : 0), i < 3 ? "#ffffff" : "#e9c0da");
}
function tulip(c, cx, cy, R, rot, P) {
  const L = R * 1.6, o = { k: 1.6, m: .8, vb: .35, vt: .95, streak: true };
  petal(c, cx, cy, rot - 5, L, L * .21, P, { ...o, lite: -.22 }); petal(c, cx, cy, rot + 5, L, L * .21, P, { ...o, lite: -.22 });
  petal(c, cx, cy, rot - 13, L * .94, L * .24, P, { ...o, lite: -.06, veins: 3 }); petal(c, cx, cy, rot + 13, L * .94, L * .24, P, { ...o, lite: -.06, veins: 3 });
  petal(c, cx, cy + 1, rot, L * .97, L * .23, P, { ...o, lite: .08, veins: 4 });
}
function hydrangea(c, cx, cy, R, rot, P, seed) {
  const N = 78, order = [];
  for (let i = 0; i < N; i++) order.push(i);
  order.sort((a, b) => hash(a, seed, 4) - hash(b, seed, 4));
  const alt = [P, ramp(mix(P[0][3], "#b070d0", .25)), ramp(mix(P[0][3], "#ffffff", .18))];
  for (const i of order) {
    const a = i * 137.508, rr = R * Math.sqrt((i + .5) / N) * .96, [x, y] = at(cx, cy, a, rr), dm = Math.hypot((x - cx) * A, y - cy) / R;
    const lite = .22 * (-(x - cx) * .5 - (y - cy) * .8) / R - .1 * dm * dm, Q = alt[Math.floor(hash(i, seed, 9) * 3)], rj = hash(i, seed, 2) * 90;
    for (let j = 0; j < 4; j++) petal(c, x, y, rj + j * 90, 5.6, 2.9, Q, { k: .8, m: .8, vb: .75, vt: .95, lite, ol: Q[1] });
    px(c, x, y, Q[0][5]);
  }
}
/* spikes: anchor at (cx,cy), axis along rot */
function floret(c, x, y, rot, n, len, wid, P, o) { for (let j = 0; j < n; j++) petal(c, x, y, rot + j * 360 / n, len, wid, P, o); }
function lavender(c, cx, cy, R, rot, P, seed) {
  const L = R * 3.4, n = 30;
  for (let i = 0; i < L; i += .8) { const [x, y] = at(cx, cy, rot, i); px(c, x, y, GREEN[0][2]); }
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), d = L * (.1 + .9 * t), w = 1 - .5 * t, [x, y] = at(cx, cy, rot, d);
    for (const s of [-1, 1]) { const [fx, fy] = at(x, y, rot + 90 * s, 2.2 * w);
      petal(c, fx, fy, rot + s * (38 + 10 * hash(i, s, 1)), 6 * w + 2, 1.9 * w + .5, P, { k: .8, m: .8, vb: .45 + .4 * t, vt: .95, ol: false, lite: (hash(i, s, 2) - .5) * .3 }); }

const stage = document.getElementById("stage");
function renderPix(c) {

}
const RAMPCH = " .'`,:;-~=+*xoO%#@";

      const i1 = y * SW + x, i2 = i1 + SW, a = scene.d[i1], b = scene.d[i2], ta = a === bd.d[i1], tb = b === bd.d[i2];

let pending = false;
function changed() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; draw(); }); }
function draw() {

function fit() {

}
addEventListener("resize", fit);

/* ---------------- interaction ---------------- */
function toPx(e) { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * SW, y: (e.clientY - r.top) / r.height * SH }; }

  for (const it of list) { const g = geo(it); for (let t = .3; t <= 1; t += .04) { const [x, y] = g.pt(t); if (Math.hypot((p.x - x) * A, p.y - y) < 4.5) return it; } }

const minY = (T, size) => 6 + T.R * size * (T.kind === "spike" ? T.len : T.kind === "spray" ? 2 : T.kind === "dir" ? 1.7 : 1.2);

  drag.it.hx = clamp(p.x + drag.ox, 8, SW - 8); drag.it.hy = clamp(p.y + drag.oy, minY(TY[drag.it.type], drag.it.size), V.my - 14); changed();

}, { passive: false });

  if ((e.key === "Backspace" || e.key === "Delete") && it) { e.preventDefault(); removeSel(); }
  else if (e.key === "Escape") { S.sel = null; S.tool = null; changed(); renderInsp(); syncPalette(); }

/* ---------------- UI ---------------- */
const palEl = document.getElementById("palette"), barEl = document.getElementById("bar"), inspEl = document.getElementById("insp");
function thumb(type) {

  const V = VASES[S.vase], keep = [V.cx, V.my, V.mhw, V.ry]; // temporarily aim the stem base at the thumb's bottom
  V.cx = 28; V.my = 60; V.mhw = 0; V.ry = 0;

  const cw = 5, ch = 4; cv.width = c.w * cw; cv.height = c.h * ch;
  const g = cv.getContext("2d"); g.fillStyle = "#0a0e11"; g.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < c.h; y++) for (let x = 0; x < c.w; x++) { const v = c.d[y * c.w + x]; if (v) { g.fillStyle = v; g.fillRect(x * cw, y * ch, cw, ch); } }
  return cv;
}
function buildPalette() {
  let cat = "", grid = null;
  for (const T of TYPES) {
    if (T.cat !== cat) { cat = T.cat; const h = document.createElement("h3"); h.textContent = cat; palEl.append(h); grid = document.createElement("div"); grid.className = "grid"; palEl.append(grid); }
    const b = document.createElement("button"); b.className = "fl"; b.dataset.id = T.id; b.append(thumb(T.id), T.name); b.title = T.name;
    b.onclick = () => { S.tool = S.tool === T.id ? null : T.id; S.toolPal = 0; syncPalette(); renderInsp(); };

}
function syncPalette() { palEl.querySelectorAll(".fl").forEach(b => b.classList.toggle("on", b.dataset.id === S.tool)); }
const btn = (label, fn, on) => { const b = document.createElement("button"); b.className = "b" + (on ? " on" : ""); b.textContent = label; b.onclick = fn; return b; };
function grp(label, ...kids) { const g = document.createElement("div"); g.className = "grp"; const s = document.createElement("span"); s.textContent = label; g.append(s, ...kids); return g; }
function syncBar() {
  barEl.innerHTML = "";
  barEl.append(
    grp("Vase", ...Object.entries(VASES).map(([k, v]) => btn(v.name, () => { S.vase = k; S.items.forEach(i => { const V = VASES[k]; i.hy = clamp(i.hy, minY(TY[i.type], i.size), V.my - 14); }); changed(); save(); syncBar(); }, S.vase === k))),
    grp("Glaze", ...GLAZES.map(([n, col], i) => { const b = document.createElement("button"); b.className = "sw" + (S.glaze === i ? " on" : ""); b.style.background = col; b.title = n; b.onclick = () => { S.glaze = i; changed(); save(); syncBar(); }; return b; })),
    grp("Backdrop", ...Object.entries(BACKDROPS).map(([k, v]) => btn(v.name, () => { S.bd = k; changed(); save(); syncBar(); }, S.bd === k))),
    grp("Render", btn("Pixel", () => { S.mode = "pixel"; changed(); save(); syncBar(); }, S.mode === "pixel"), btn("ASCII", () => { S.mode = "ascii"; changed(); save(); syncBar(); }, S.mode === "ascii")),
    grp("", btn("Surprise me", surprise), (() => { const u = btn("Undo", undo); u.disabled = !hist.length; return u; })(), btn("Clear", () => { if (!S.items.length) return; pushHist(); S.items = []; S.sel = null; changed(); renderInsp(); save(); }), btn("Save PNG", savePng)),

}

/* ---------------- class stage + voice (TDM 155AI week 10) ----------------
   The arrangement can go to /stage as an image cue (same BroadcastChannel contract as the rest of the app:
   see lib/stage/stage.js), and a microphone button lets you say flower names to place them. */
const STAGE_CHANNEL = "tdm155ai-stage";
let stageBus = null, liveTimer = 0;
function sendToStage(fade = 0.3) {
  try {
    stageBus = stageBus || new BroadcastChannel(STAGE_CHANNEL);
    const cue = { id: "ikebana", label: "Ikebana", kind: "image", src: snapshot(3, 2.5).toDataURL("image/jpeg", 0.9), options: { fit: "contain", fadeIn: fade } };
    stageBus.postMessage({ type: "cue", cue, at: Date.now() });
  } catch (e) {}
}
function scheduleLive() { if (!S.live) return; clearTimeout(liveTimer); liveTimer = setTimeout(() => sendToStage(0), 250); }

const heardEl = document.createElement("span"); heardEl.className = "hint"; heardEl.id = "heard";

function voiceWords() { // word or phrase -> action
  const m = new Map();
  for (const T of TYPES) {
    const n = norm(T.name); m.set(n, () => placeNamed(T.id));
    if (n === "babys breath" || n === "babys  breath") m.set("babys breath", () => placeNamed(T.id));
  }
  for (const [k, v] of Object.entries(VASES)) m.set(norm(v.name).replace(/^flat /, "").replace(/^tall /, "").replace(/ vase$/, ""), () => { S.vase = k; S.items.forEach(i => { i.hy = clamp(i.hy, minY(TY[i.type], i.size), v.my - 14); }); changed(); save(); syncBar(); });
  for (const [k, v] of Object.entries(BACKDROPS)) m.set(norm(v.name), () => { S.bd = k; changed(); save(); syncBar(); });
  m.set("clear", () => { pushHist(); S.items = []; S.sel = null; changed(); renderInsp(); save(); });
  m.set("surprise", surprise);
  m.set("ascii", () => { S.mode = "ascii"; changed(); save(); syncBar(); });
  m.set("pixel", () => { S.mode = "pixel"; changed(); save(); syncBar(); });
  m.set("undo", undo);

}
function placeNamed(id) { // put one flower of this type somewhere on the arc above the vase

  S.toolPal = Math.floor(Math.random() * T.cols.length); S.toolSize = .85 + Math.random() * .35;

let rec = null, recWanted = false;
function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { heardEl.textContent = "Voice needs Chrome or Edge."; return; }
  recWanted = !recWanted; syncBar();
  if (!recWanted) { rec && rec.stop(); heardEl.textContent = ""; return; }
  const words = voiceWords(), seen = {};
  rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";
  rec.onresult = ev => {
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = " " + norm(ev.results[i][0].transcript) + " "; heardEl.textContent = "heard: " + t.trim();
      for (const [w, act] of words) {
        const n = t.split(" " + w + " ").length - 1, key = i + "|" + w; // count whole-word hits; fire only new ones

function surprise() {
  pushHist(); const V = VASES[S.vase], items = [], seed0 = S.nextSeed;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const by = (...ids) => ids.map(i => TY[i]);

    ...Array(2).fill(["fol", 105, 135]), ["spray", 95, 118], ["spray", 88, 110],
    ...Array(3).fill(["focal", 40, 78]), ...Array(5).fill(["mid", 66, 108]), ...Array(2).fill(["spike", 92, 124]), ["mid", 70, 104],

  const n = plan.length, angs = plan.map((_, i) => -62 + 124 * (i + .5) / n).sort(() => Math.random() - .5);
  plan.forEach(([k, r0, r1], i) => {
    const T = pick(pools[k]), th = angs[i] + (Math.random() - .5) * 10, r = (r0 + Math.random() * (r1 - r0)) * clamp((V.my - 36) / 140, .5, 1), kk = V.shape === "round" ? 1 : .85;
    S.toolPal = Math.floor(Math.random() * T.cols.length); S.toolSize = .85 + Math.random() * .35;
    const it = place(T.id, V.cx + sn(th) * r * 1.05 * kk, V.my - cs(th) * r * 1.1); it.turn = k === "rad" ? Math.round(Math.random() * 360 - 180) : 0; items.push(it);
  });

}

/* ---------------- boot ---------------- */
